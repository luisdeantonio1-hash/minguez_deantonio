<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha personal</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page page--detail">
    <nav class="site-nav" aria-label="Navegacion principal">
      <a class="site-nav__link" href="index.html">Listado</a>
      <a class="site-nav__link" id="person-tree-link" href="arbol.html">Arbol genealogico</a>
      <span class="site-nav__link site-nav__link--active" aria-current="page">Ficha personal</span>
    </nav>

    <section class="hero hero--detail">
      <p class="eyebrow">Ficha personal</p>
      <h1 id="person-name">Cargando...</h1>
      <p class="lead" id="person-subtitle"></p>
      <p class="description" id="person-summary"></p>
    </section>

    <section class="detail-grid">
      <article class="detail-card">
        <h2>Información general</h2>
        <dl class="detail-list" id="person-facts">
          <div>
            <dt>Estado</dt>
            <dd>Cargando datos...</dd>
          </div>
        </dl>
      </article>

      <article class="detail-card">
        <h2>Imagen principal</h2>
        <figure class="detail-figure">
          <img id="person-image" alt="">
          <figcaption id="person-image-caption"></figcaption>
        </figure>
      </article>
    </section>

    <section class="detail-card">
      <h2>Biografía</h2>
      <div id="person-biography"></div>
    </section>

    <section class="detail-card">
      <div class="table-header">
        <h2>Galería</h2>
        <p>Imágenes y documentos asociados a esta memoria personal.</p>
      </div>
      <div class="gallery-grid" id="person-gallery"></div>
    </section>
  </main>

  <noscript class="noscript-message">
    No se ha podido mostrar el contenido completo de esta página.
  </noscript>

  <script src="js/detail.js"></script>
</body>
</html>
