<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="listing.title"></title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <nav class="site-nav" data-i18n-attr="aria-label:common.nav.mainAria">
      <a class="site-nav__link site-nav__link--active" href="index.html" aria-current="page" data-i18n="common.nav.list"></a>
      <a class="site-nav__link" href="arbol.html" data-i18n="common.nav.tree"></a>
    </nav>

    <section class="hero">
      <p class="eyebrow" data-i18n="listing.hero.eyebrow"></p>
      <h1 data-i18n="listing.hero.heading"></h1>
      <p class="lead" data-i18n="listing.hero.lead"></p>
      <p class="description" data-i18n="listing.hero.description"></p>
    </section>

    <section class="table-section" aria-labelledby="tabla-fallecidos">
      <div class="table-header">
        <h2 id="tabla-fallecidos" data-i18n="listing.table.heading"></h2>
        <p data-i18n="listing.table.description"></p>
      </div>

      <div class="table-wrapper">
        <table>
          <thead id="records-head"></thead>
          <tbody id="records-body">
            <tr>
              <td data-i18n="listing.table.loading"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <noscript class="noscript-message" data-i18n="common.noscript.generic"></noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
